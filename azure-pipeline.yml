trigger:
- main   # or your branch

variables:
  acrName: mcpregistrycontainer.azurecr.io        # replace with your ACR login server
  imageName: mcp-server1                # your image repo name in ACR
  imageTag: $(Build.BuildId)             # unique tag per build
  serviceConnection: services-connection-pratiksha   # name of your Azure Resource Manager service connection
  containerRegistry: DES-ACR
  appName: mcp-container1                 # your Web App name in Azure

pool:
  vmImage: ubuntu-latest   # Linux agent (Windows agents cause node image pull errors)

stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        command: buildAndPush
        repository: $(acrName)/$(imageName)
        dockerfile: $(Build.SourcesDirectory)/Dockerfile
        containerRegistry: $(containerRegistry)   # this must be a Docker Registry/ACR service connection
        tags: |
          $(imageTag)

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: Build
  jobs:
  - job: Deploy
    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy to Web App Container
      inputs:
        azureSubscription: $(serviceConnection)   # Azure RM service connection
        appName: $(appName)
        containers: |
          $(acrName)/$(imageName):$(imageTag)