trigger:
- main   # or your branch

variables:
  acrName: mcpregistrycontainer.azurecr.io        # ACR login server
  imageName: mcp-server1                          # image repo name in ACR
  imageTag: $(Build.BuildId)                      # unique tag per build
  serviceConnection: services-connection-pratiksha   # Azure RM service connection
  containerRegistry: DES-ACR                      # Docker Registry service connection for ACR
  appName: mcp-container1                         # Web App name in Azure

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        command: buildAndPush
        repository: $(imageName)                # ✅ only repo name, not full URL
        dockerfile: $(Build.SourcesDirectory)/Dockerfile
        containerRegistry: $(containerRegistry) # must be a Docker Registry service connection
        tags: |
          $(imageTag)

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: Build
  jobs:
  - job: Deploy
    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy to Web App Container
      inputs:
        azureSubscription: $(serviceConnection)
        appName: $(appName)
        containers: |
          DOCKER|$(acrName)/$(imageName):$(imageTag)   # ✅ correct full path
